services:
  gitea-runner:
    image: gitea/act_runner:0.2.11
    container_name: gitea-runner
    restart: unless-stopped
    # CI runner активируется отдельно — обычный `make deploy` без
    # `--profile ci` не поднимает его. Без токена в GITEA_RUNNER_REG_TOKEN
    # контейнер уходит в crash-loop, поэтому safe-default = выключен.
    # Включи вручную после регистрации: docker compose ... --profile ci up -d
    profiles: [ci]
    environment:
      GITEA_INSTANCE_URL: https://git.stit.tech
      # Token используется только на первом старте. После регистрации
      # значение можно убрать из .env.
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REG_TOKEN}
      GITEA_RUNNER_NAME: ${PROJECT_NAME}-runner
      GITEA_RUNNER_LABELS: "${PROJECT_NAME}-prod,${PROJECT_NAME}-staging,docker"
    volumes:
      - runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy
