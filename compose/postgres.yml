services:
  postgres:
    image: postgres:17.2-alpine
    container_name: postgres
    restart: unless-stopped
    # POSTGRES_USER/PASSWORD/DB come from vault-agent rendered file.
    # postgres image accepts them via env_file the same way as direct env.
    env_file:
      - .runtime/secrets/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - backend-net
    healthcheck:
      # POSTGRES_USER/DB come from env_file (rendered by vault-agent).
      # $$ escapes compose interpolation; the container shell expands.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      vault-agent:
        condition: service_healthy
