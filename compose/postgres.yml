services:
  postgres:
    image: postgres:17.9-alpine
    container_name: postgres
    restart: unless-stopped
    profiles: [postgres]
    # POSTGRES_USER/PASSWORD/DB приходят из .env (оператор заполняет,
    # см. .env.example § profile postgres).
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - backend-net
    healthcheck:
      # $$ — escape compose-интерполяции, переменные раскрывает shell в контейнере.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
