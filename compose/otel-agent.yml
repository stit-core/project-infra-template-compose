services:
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.151.0
    container_name: otel-agent
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    # Bearer-token + OTEL_TENANT приходят из .runtime/secrets/otel.env —
    # always-on vault-agent template (профильно-независимый). OTEL endpoint
    # hardcoded в configs/otel-agent/config.yaml — корп-константа.
    env_file:
      - .runtime/secrets/otel.env
    volumes:
      - ./configs/otel-agent/config.yaml:/etc/otel/config.yaml:ro
      - otel-agent-data:/var/lib/otel
    networks:
      - proxy            # outbound к otel.stit.tech
      - backend-net      # принимает OTLP от backend
    depends_on:
      vault-agent:
        condition: service_healthy
    # Образ otel/opentelemetry-collector-contrib distroless — внутри
    # только бинарь /otelcol-contrib, нет shell / wget / curl. HTTP-probe
    # health_check extension изнутри контейнера невозможен. Используем
    # `validate` как smoke: проверяет что бинарь работает и читает
    # конфиг. Полноценный probe (что HTTP-сервер реально принимает данные)
    # требует sidecar — отложено.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
