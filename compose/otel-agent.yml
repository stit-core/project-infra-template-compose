services:
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: otel-agent
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    # Bearer-token берётся из backend.env (там OTEL_TOKEN). Лишние
    # переменные из backend.env для otel-agent безвредны.
    env_file:
      - .runtime/secrets/backend.env
    environment:
      OTEL_TENANT: ${OTEL_TENANT}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE}
    volumes:
      - ./configs/otel-agent/config.yaml:/etc/otel/config.yaml:ro
      - otel-agent-data:/var/lib/otel
    networks:
      - proxy            # outbound к otel.stit.tech
      - backend-net      # принимает OTLP от backend
    depends_on:
      vault-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
