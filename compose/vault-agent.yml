services:
  vault-agent:
    image: hashicorp/vault:1.18.3
    container_name: vault-agent
    restart: unless-stopped
    # Trampoline: пишем role-id / secret-id в bootstrap-volume, откуда
    # auto_auth их читает, и exec'аем agent. Через entrypoint (а не
    # напрямую в config) — чтобы значения не светились в `docker inspect`.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s' "$$VAULT_ROLE_ID"   > /secrets-bootstrap/role-id
        printf '%s' "$$VAULT_SECRET_ID" > /secrets-bootstrap/secret-id
        chmod 0400 /secrets-bootstrap/role-id /secrets-bootstrap/secret-id
        exec vault agent -config=/etc/vault-agent/agent.hcl
    environment:
      VAULT_ROLE_ID:      ${VAULT_ROLE_ID}
      VAULT_SECRET_ID:    ${VAULT_SECRET_ID}
      PROJECT_NAME:       ${PROJECT_NAME}           # consul-template (env "PROJECT_NAME")
      ENV:                ${ENV}                    # consul-template (env "ENV") — multi-env dimension
      DOMAIN:             ${DOMAIN}                 # резерв для шаблонов, использующих хост-имя
    volumes:
      - ./configs/vault-agent/agent.hcl:/etc/vault-agent/agent.hcl:ro
      - ./configs/vault-agent/templates:/etc/vault-agent/templates:ro
      - ./.runtime/secrets:/secrets
      - ./.runtime/secrets-bootstrap:/secrets-bootstrap
      - ./.runtime/env:/env                          # compose.env для compose --env-file
      - ./.runtime/configs:/configs                  # rendered configs (traefik.yml, ...)
    networks:
      - proxy            # outbound к vault.stit.tech
      - backend-net      # consumer'ы читают rendered-файлы через bind-mount
    healthcheck:
      # Healthy = ВСЕ expected outputs под активный COMPOSE_PROFILES непустые.
      # Список output'ов profile-зависим; render-configs.sh генерит конкретный
      # health-script в .runtime/configs/vault-health.sh при каждом deploy.
      # Always-on проверки: /env/compose.env, /configs/traefik.yml, /secrets/otel.env.
      # Per-profile добавки: postgres.env / backend.env / minio.env / backup.env.
      test: ["CMD", "sh", "/configs/vault-health.sh"]
      interval: 5s
      timeout: 2s
      retries: 24        # ~2 мин на первый auth + render
      start_period: 5s
