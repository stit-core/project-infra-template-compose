services:
  vault-agent:
    image: hashicorp/vault:1.18.3
    container_name: vault-agent
    restart: unless-stopped
    # Trampoline: пишем role-id / secret-id в bootstrap-volume, откуда
    # auto_auth их читает, и exec'аем agent. Через entrypoint (а не
    # напрямую в config) — чтобы значения не светились в `docker inspect`.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf '%s' "$$VAULT_ROLE_ID"   > /secrets-bootstrap/role-id
        printf '%s' "$$VAULT_SECRET_ID" > /secrets-bootstrap/secret-id
        chmod 0400 /secrets-bootstrap/role-id /secrets-bootstrap/secret-id
        exec vault agent -config=/etc/vault-agent/agent.hcl
    environment:
      VAULT_ROLE_ID:      ${VAULT_ROLE_ID}
      VAULT_SECRET_ID:    ${VAULT_SECRET_ID}
      VAULT_ADDR:         ${VAULT_ADDR}
      PROJECT_NAME:       ${PROJECT_NAME}
      DOMAIN:             ${DOMAIN}              # для consul-template `env "DOMAIN"`
      RESTIC_REPOSITORY:  ${RESTIC_REPOSITORY}   # endpoint для restic backup, см. backup.env.tpl
    volumes:
      - ./configs/vault-agent/agent.hcl:/etc/vault-agent/agent.hcl:ro
      - ./configs/vault-agent/templates:/etc/vault-agent/templates:ro
      - ./.runtime/secrets:/secrets
      - ./.runtime/secrets-bootstrap:/secrets-bootstrap
    networks:
      - proxy            # outbound к vault.stit.tech
      - backend-net      # consumer'ы читают rendered-файлы через bind-mount
    healthcheck:
      # Healthy = blocker-секреты непустые (backend.env + postgres.env).
      # Просто `.ready` marker не годится: consul-template рендерит
      # static-template (`.ready` с contents="ready") раньше, чем те,
      # что требуют запроса в Vault — postgres / backend стартовали с
      # пустым env_file и падали.
      #
      # ВАЖНО — minio.env / backup.env здесь НЕ проверяем намеренно.
      # Это позволяет стеку подняться частично, если корп ещё не засеял
      # kv/projects/<p>/{minio,backup}: traefik / crowdsec / landing
      # стартуют, оператор видит работающий https://${DOMAIN} (landing),
      # а minio / backup явно красные в `make ps`. Если добавить их сюда —
      # vault-agent застрянет в "starting" пока админ не засеет, и
      # все consumer'ы вместе с ним.
      #
      # Добавляй сюда новый render target только если он blocker для
      # core-стека (postgres / backend / traefik-зависимый).
      test: ["CMD-SHELL", "test -s /secrets/backend.env && test -s /secrets/postgres.env"]
      interval: 5s
      timeout: 2s
      retries: 24        # ~2 мин на первый auth + render
      start_period: 5s
