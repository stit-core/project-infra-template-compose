services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio
    restart: unless-stopped
    # On by default. Креды генерит scripts/new-env.sh (.onboard-creds),
    # оператор относит блок корп-админу для seed'а в Vault
    # (kv/projects/<p>/minio: root_user, root_password, app_access_key,
    # app_secret_key, backup_access_key, backup_secret_key, buckets опц.).
    # Все клиенты (backend, restic, mc у stit-админа) ходят через публичный
    # s3.${DOMAIN}, без привязки к docker-network. Внутренний minio:9000
    # используется ТОЛЬКО minio-init'ом (bootstrap-sidecar в том же compose);
    # для остальных endpoint один — публичный URL через traefik. Это значит,
    # что restic-репо живёт в том же minio, что бекапит postgres-data: если
    # minio-data накроется, и app-uploads, и backups теряются. Trade-off
    # простоты против DR; для устойчивости — mc mirror в корп-S3 / offsite cron.
    command: server /data --console-address ":9001"
    env_file:
      - .runtime/secrets/minio.env
    environment:
      MINIO_BROWSER_REDIRECT_URL: https://minio.${DOMAIN}
      MINIO_SERVER_URL: https://s3.${DOMAIN}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    depends_on:
      vault-agent:
        condition: service_healthy
    volumes:
      - minio-data:/data
    networks:
      - proxy        # traefik s3.${DOMAIN} + minio.${DOMAIN}
      - backend-net  # backend → minio:9000 внутрь
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy

      # S3 API — s3.${DOMAIN} :9000, без auth-middleware (S3-клиенты используют SigV4).
      traefik.http.routers.minio-s3.rule: Host(`s3.${DOMAIN}`)
      traefik.http.routers.minio-s3.entrypoints: websecure
      traefik.http.routers.minio-s3.tls: "true"
      traefik.http.routers.minio-s3.tls.certresolver: letsencrypt
      traefik.http.routers.minio-s3.service: minio-s3
      traefik.http.routers.minio-s3.middlewares: crowdsec@file,rate-limit@file
      traefik.http.services.minio-s3.loadbalancer.server.port: "9000"

      # Console — minio.${DOMAIN} :9001. В шаблоне нет Authentik (проектная
      # сторона без IDP), поэтому только crowdsec+rate-limit. Если нужен
      # SSO — заворачивай через корп-Authentik отдельной интеграцией, либо
      # ограничивай доступ IP-allowlist'ом / отключай маршрут.
      traefik.http.routers.minio-console.rule: Host(`minio.${DOMAIN}`)
      traefik.http.routers.minio-console.entrypoints: websecure
      traefik.http.routers.minio-console.tls: "true"
      traefik.http.routers.minio-console.tls.certresolver: letsencrypt
      traefik.http.routers.minio-console.service: minio-console
      traefik.http.routers.minio-console.middlewares: crowdsec@file,rate-limit@file
      traefik.http.services.minio-console.loadbalancer.server.port: "9001"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    container_name: minio-init
    restart: "no"
    # Идемпотентный bootstrap: создаёт bucket'ы и service-account'ы по
    # значениям из minio.env. Безопасно прогонять на каждом deploy.
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .runtime/secrets/minio.env
    networks:
      - backend-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"

        # Bucket-list берём из MINIO_BUCKETS (space-separated). Дефолт —
        # один bucket app-uploads, под кейс file-uploads из backend'а.
        for b in $${MINIO_BUCKETS:-app-uploads}; do
          mc mb --ignore-existing "local/$$b"
        done

        # Bucket "backups" — restic-repo для backup-сервиса. Создаём всегда,
        # даже если backup-профиль выключен: bucket в idle minio места почти
        # не занимает, а включение backup'а позже не потребует доп. шага.
        mc mb --ignore-existing local/backups

        # Policies — bucket-scoped, по одной на SA.
        cat >/tmp/app-policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": ["s3:*"],
            "Resource": ["arn:aws:s3:::app-uploads", "arn:aws:s3:::app-uploads/*"]
          }]
        }
        EOF

        cat >/tmp/backup-policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": ["s3:*"],
            "Resource": ["arn:aws:s3:::backups", "arn:aws:s3:::backups/*"]
          }]
        }
        EOF

        upsert_sa() {
          name=$$1; ak=$$2; sk=$$3; policy=$$4
          [ -z "$$ak" ] && { echo "skip $$name: access-key not set"; return 0; }
          if mc admin user svcacct info local "$$ak" >/dev/null 2>&1; then
            echo "service account $$name ($$ak) exists, updating policy"
            mc admin user svcacct edit local "$$ak" --policy "$$policy"
          else
            echo "creating service account $$name ($$ak)"
            mc admin user svcacct add local "$$MINIO_ROOT_USER" \
              --access-key "$$ak" --secret-key "$$sk" --policy "$$policy"
          fi
        }

        upsert_sa app    "$${APP_S3_ACCESS_KEY:-}"    "$${APP_S3_SECRET_KEY:-}"    /tmp/app-policy.json
        upsert_sa backup "$${BACKUP_S3_ACCESS_KEY:-}" "$${BACKUP_S3_SECRET_KEY:-}" /tmp/backup-policy.json

        echo "minio-init done"
        mc ls local/
