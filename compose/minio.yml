services:
  minio:
    # PGSTY Silo — сопровождаемый форк MinIO (AGPL): S3 API, переменные MINIO_*, формат данных на
    # диске и пробы /minio/health/* — как у MinIO; сервер — silo, клиент — mcli. Образ у minio-init
    # тот же: бамп — одной версией у обоих сервисов.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: minio
    restart: unless-stopped
    # Opt-in: COMPOSE_PROFILES=storage. Креды оператор заполняет в .env
    # (см. .env.example § profile storage).
    #
    # BACKUP_S3_ACCESS_KEY/SECRET_KEY нужны для local-minio rehearsal:
    # minio-init создаёт `backup` SA и `backups` bucket под restic, если
    # RESTIC_REPOSITORY указывает на http://minio:9000/... При external
    # endpoint эти SA + bucket остаются rehearsal-инфраструктурой (пустой
    # bucket, неактивный SA); реальные creds endpoint'а — BACKUP_AWS_* в .env.
    profiles: [storage]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://minio.${DOMAIN}
      MINIO_SERVER_URL: https://s3.${DOMAIN}
    volumes:
      - minio-data:/data
    networks:
      - proxy        # traefik s3.${DOMAIN} + minio.${DOMAIN}
      - backend-net  # backend → minio:9000 внутрь
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy

      # S3 API — s3.${DOMAIN} :9000, без auth-middleware (S3-клиенты используют SigV4).
      traefik.http.routers.minio-s3.rule: Host(`s3.${DOMAIN}`)
      traefik.http.routers.minio-s3.entrypoints: websecure
      traefik.http.routers.minio-s3.tls: "true"
      traefik.http.routers.minio-s3.tls.certresolver: letsencrypt
      traefik.http.routers.minio-s3.service: minio-s3
      traefik.http.routers.minio-s3.middlewares: crowdsec@file,rate-limit@file
      traefik.http.services.minio-s3.loadbalancer.server.port: "9000"

      # Console — minio.${DOMAIN} :9001. IDP в стеке нет, поэтому только
      # crowdsec+rate-limit; сузить доступ — IP-allowlist'ом или отключением
      # маршрута.
      traefik.http.routers.minio-console.rule: Host(`minio.${DOMAIN}`)
      traefik.http.routers.minio-console.entrypoints: websecure
      traefik.http.routers.minio-console.tls: "true"
      traefik.http.routers.minio-console.tls.certresolver: letsencrypt
      traefik.http.routers.minio-console.service: minio-console
      traefik.http.routers.minio-console.middlewares: crowdsec@file,rate-limit@file
      traefik.http.services.minio-console.loadbalancer.server.port: "9001"

  minio-init:
    # Клиент mcli — в образе сервера.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: minio-init
    restart: "no"
    profiles: [storage]
    # Идемпотентный bootstrap: создаёт bucket'ы и service-account'ы по
    # значениям из .env. Безопасно прогонять на каждом deploy.
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKETS: ${MINIO_BUCKETS:-}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:-}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    networks:
      - backend-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mcli alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"

        # Bucket-list берём из MINIO_BUCKETS (space-separated). Дефолт —
        # один bucket app-uploads, под кейс file-uploads из backend'а.
        for b in $${MINIO_BUCKETS:-app-uploads}; do
          mcli mb --ignore-existing "local/$$b"
        done

        # Bucket "backups" — restic-repo для backup-сервиса. Создаём всегда,
        # даже если backup-профиль выключен: bucket в idle minio места почти
        # не занимает, а включение backup'а позже не потребует доп. шага.
        mcli mb --ignore-existing local/backups

        # Policies — bucket-scoped, по одной на SA.
        cat >/tmp/app-policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": ["s3:*"],
            "Resource": ["arn:aws:s3:::app-uploads", "arn:aws:s3:::app-uploads/*"]
          }]
        }
        EOF

        cat >/tmp/backup-policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": ["s3:*"],
            "Resource": ["arn:aws:s3:::backups", "arn:aws:s3:::backups/*"]
          }]
        }
        EOF

        upsert_sa() {
          name=$$1; ak=$$2; sk=$$3; policy=$$4
          [ -z "$$ak" ] && { echo "skip $$name: access-key not set"; return 0; }
          if mcli admin user svcacct info local "$$ak" >/dev/null 2>&1; then
            echo "service account $$name ($$ak) exists, updating policy"
            mcli admin user svcacct edit local "$$ak" --policy "$$policy"
          else
            echo "creating service account $$name ($$ak)"
            mcli admin user svcacct add local "$$MINIO_ROOT_USER" \
              --access-key "$$ak" --secret-key "$$sk" --policy "$$policy"
          fi
        }

        upsert_sa app    "$${APP_S3_ACCESS_KEY:-}"    "$${APP_S3_SECRET_KEY:-}"    /tmp/app-policy.json
        upsert_sa backup "$${BACKUP_S3_ACCESS_KEY:-}" "$${BACKUP_S3_SECRET_KEY:-}" /tmp/backup-policy.json

        echo "minio-init done"
        mcli ls local/
