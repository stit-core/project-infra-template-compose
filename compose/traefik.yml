services:
  traefik:
    image: traefik:v3.6.16
    container_name: traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
      # ACME email + caServer теперь в static traefik.yml (рендерится из
      # traefik.yml.tpl через envsubst). См. комментарий в .tpl.
      # Переключение prod ↔ staging: ACME_CASERVER в .env + удалить
      # volume traefik-acme (acme.json привязан к CA-серверу).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      crowdsec:
        condition: service_healthy
