services:
  traefik:
    image: traefik:v3.6.16
    container_name: traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
      # ACME email через CLI: traefik.yml не envsubst'ится (нет .tpl),
      # static config'у нужен литерал email — иначе LE → invalidContact.
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      # ACME CA server: prod LE по дефолту, staging для обкатки шаблона
      # (rate-limits в ~100× выше, но сертификаты untrusted). Переключение —
      # ACME_CASERVER=https://acme-staging-v02.api.letsencrypt.org/directory
      # в .env + удалить volume traefik-acme (acme.json привязан к CA-серверу,
      # старые order'ы не работают на новом CA).
      - "--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      crowdsec:
        condition: service_healthy
