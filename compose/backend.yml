services:
  backend:
    image: ${REGISTRY_HOST:-git.stit.tech}/${PROJECT_NAME}/backend:${BACKEND_TAG}
    container_name: backend
    restart: unless-stopped
    # Opt-in: COMPOSE_PROFILES=backend. Без опубликованного image'а в
    # git.stit.tech/<project>/backend `compose up --wait` упадёт на pull'е,
    # поэтому стартуем только когда image реально доступен.
    profiles: [backend]
    # Секреты приходят из .env (см. .env.example § profile backend). PG_DSN
    # собирается интерполяцией: PG_HOST/PG_PORT опциональны (дефолт
    # postgres:5432 — co-located single-host; при multi-host split оператор
    # задаёт адрес db-хоста в .env).
    environment:
      APP_ENV: ${ENV}
      PG_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PG_HOST:-postgres}:${PG_PORT:-5432}/${POSTGRES_DB}?sslmode=disable
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - backend-net
    healthcheck:
      # golibinfra/httpkit регистрирует /health (liveness) и /ready (с DB-probe).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.backend.rule: Host(`api.${DOMAIN}`)
      traefik.http.routers.backend.entrypoints: websecure
      traefik.http.routers.backend.tls: "true"
      traefik.http.routers.backend.tls.certresolver: letsencrypt
      traefik.http.routers.backend.middlewares: crowdsec@file,secure-headers@file,rate-limit@file
      traefik.http.services.backend.loadbalancer.server.port: "8080"
