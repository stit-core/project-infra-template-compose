services:
  backend:
    image: git.stit.tech/${PROJECT_NAME}/backend:${BACKEND_TAG}
    container_name: backend
    restart: unless-stopped
    # Opt-in: COMPOSE_PROFILES=backend. Без опубликованного image'а в
    # git.stit.tech/<project>/backend `compose up --wait` упадёт на pull'е,
    # поэтому стартуем только когда image реально доступен.
    profiles: [backend]
    # OTEL_TENANT, OTEL_TOKEN, PG_DSN, OIDC_*, JWT_SECRET — из vault-agent
    # rendered backend.env (env_file ниже).
    environment:
      APP_ENV: ${ENV}
      OTEL_SERVICE_NAME: backend
      # Backend → local otel-agent → корп otel.stit.tech.
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-agent:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    env_file:
      - .runtime/secrets/otel.env      # OTEL_TOKEN + OTEL_TENANT (always-on)
      - .runtime/secrets/backend.env   # PG_DSN, OIDC_*, JWT_SECRET (profile=backend)
    depends_on:
      vault-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-agent:
        condition: service_healthy
    networks:
      - proxy
      - backend-net
    healthcheck:
      # golibinfra/httpkit регистрирует /health (liveness) и /ready (с DB-probe).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.backend.rule: Host(`api.${DOMAIN}`)
      traefik.http.routers.backend.entrypoints: websecure
      traefik.http.routers.backend.tls: "true"
      traefik.http.routers.backend.tls.certresolver: letsencrypt
      traefik.http.routers.backend.middlewares: crowdsec@file,secure-headers@file,rate-limit@file
      traefik.http.services.backend.loadbalancer.server.port: "8080"
