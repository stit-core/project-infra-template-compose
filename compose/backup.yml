services:
  backup:
    build: ./containers/backup
    image: ${PROJECT_NAME:-project}/backup:local
    container_name: backup
    restart: unless-stopped
    profiles: [storage]
    # Self-contained: alpine + restic + pg_dumpall + busybox crond. Никакой
    # host-orchestration: cron внутри контейнера дёргает /usr/local/bin/backup-now
    # ежедневно. One-shot smoke-test: `docker exec backup /usr/local/bin/backup-now`
    # (или `make backup`). Расписание — containers/backup/crontab.
    #
    # Все backup-параметры приходят из .env (см. .env.example § profile
    # storage): RESTIC_REPOSITORY/RESTIC_PASSWORD + S3-креды endpoint'а
    # (BACKUP_AWS_*) + postgres-креды для pg_dumpall. RESTIC_PASSWORD
    # ОБЯЗАТЕЛЬНО продублирован offsite — без него restore невозможен.
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${PG_HOST:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net      # подключение к postgres:5432 + minio:9000
      - proxy            # внешний S3 endpoint (если переопределён в .env)
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
