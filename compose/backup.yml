services:
  backup:
    build: ./containers/backup
    image: ${PROJECT_NAME:-project}/backup:local
    container_name: backup
    restart: unless-stopped
    # Self-contained: alpine + restic + pg_dumpall + busybox crond. Никакой
    # host-orchestration: cron внутри контейнера дёргает /usr/local/bin/backup-now
    # ежедневно. One-shot smoke-test: `docker exec backup /usr/local/bin/backup-now`
    # (или `make backup`). Расписание — containers/backup/crontab.
    #
    # Endpoint для restic-репо приходит из RESTIC_REPOSITORY (см. .env);
    # дефолт `s3:http://minio:9000/backups` — внутренний minio через docker
    # network, без traefik/DNS/TLS. Для prod / off-site — менять в .env.
    #
    # Креды:
    #   POSTGRES_USER/PASSWORD/HOST — из kv/projects/<p>/db (тот же source,
    #     что postgres-контейнер; postgres-client коннектится по backend-net)
    #   AWS_ACCESS_KEY_ID/SECRET    — из kv/projects/<p>/minio (backup_*)
    #   RESTIC_PASSWORD             — из kv/projects/<p>/backup
    # Всё рендерит vault-agent в .runtime/secrets/backup.env.
    env_file:
      - .runtime/secrets/backup.env
    depends_on:
      vault-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - backend-net      # подключение к postgres:5432 + minio:9000
      - proxy            # внешний S3 endpoint (если переопределён в .env)
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
