services:
  backup:
    build: ./containers/backup
    image: ${PROJECT_NAME:-project}/backup:local
    container_name: backup
    restart: unless-stopped
    profiles: [storage]
    # Self-contained: alpine + restic + pg_dumpall + busybox crond. Никакой
    # host-orchestration: cron внутри контейнера дёргает /usr/local/bin/backup-now
    # ежедневно. One-shot smoke-test: `docker exec backup /usr/local/bin/backup-now`
    # (или `make backup`). Расписание — containers/backup/crontab.
    #
    # Все backup-параметры (endpoint, creds, restic password, postgres creds)
    # живут в Vault и рендерятся vault-agent'ом в .runtime/secrets/backup.env:
    #   RESTIC_REPOSITORY + RESTIC_PASSWORD + AWS_*  — kv/projects/<p>/<env>/backup
    #   POSTGRES_USER/PASSWORD/HOST                  — kv/projects/<p>/<env>/db
    # Ротация endpoint'а — `vault kv patch kv/projects/<p>/<env>/backup repository=...`.
    env_file:
      - .runtime/secrets/backup.env
    depends_on:
      vault-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - backend-net      # подключение к postgres:5432 + minio:9000
      - proxy            # внешний S3 endpoint (если переопределён в .env)
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
