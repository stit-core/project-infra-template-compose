services:
  backup:
    image: restic/restic:0.17.3
    container_name: backup
    restart: "no"
    # Долгоживущий контейнер, дёргается через host-cron:
    # `docker exec backup /usr/local/bin/run-backup.sh`. Альтернатива —
    # отдельный image c crond внутри; не делаем ради простоты, host-cron
    # и так уже точка управления backup.sh.
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - postgres-data:/data/postgres:ro
      - ./scripts/backup.sh:/usr/local/bin/run-backup.sh:ro
      - backup-cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy            # outbound к S3-endpoint
