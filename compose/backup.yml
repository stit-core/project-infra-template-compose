services:
  backup:
    image: restic/restic:0.18.1
    container_name: backup
    restart: "no"
    # Opt-in: COMPOSE_PROFILES=backup. Перед включением:
    # 1) корп-сторона seed'ит kv/data/projects/<project>/backup в Vault
    #    (поля: repository, password, aws_access_key_id, aws_secret_access_key);
    # 2) раскомментируй backup-template в configs/vault-agent/agent.hcl.tpl.
    # Долгоживущий контейнер, дёргается через host-cron:
    # `docker exec backup /usr/local/bin/run-backup.sh`. Альтернатива —
    # отдельный image c crond внутри; не делаем ради простоты, host-cron
    # и так уже точка управления backup.sh.
    profiles: [backup]
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    env_file:
      - .runtime/secrets/backup.env
    depends_on:
      vault-agent:
        condition: service_healthy
    volumes:
      - postgres-data:/data/postgres:ro
      - ./scripts/backup.sh:/usr/local/bin/run-backup.sh:ro
      - backup-cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy            # outbound к S3-endpoint
