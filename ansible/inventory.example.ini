; Copy to inventory.ini and fill in. inventory.ini gitignored.
;
; Перед запуском ansible убедись, что у тебя есть SSH доступ к VPS:
;   • либо ssh-copy-id root@<vps> (одна команда с паролем провайдера)
;   • либо задай operator_ssh_pubkey ниже — base-role положит его в
;     /root/.ssh/authorized_keys ДО ssh-hardening.

[project_vps]
; project_repo_url — SSH-форма обязательна (deploy-key используется для clone).
prod ansible_host=1.2.3.4 ansible_user=root project_name=acme project_repo_url=git@git.sftbmb.ru:acme/infra.git

[project_vps:vars]
ansible_python_interpreter=/usr/bin/python3
; Опционально: pubkey оператора (ed25519/rsa). Заливается в authorized_keys
; до ssh-hardening. Если ключ уже на хосте — оставь пустым / закомментируй.
; operator_ssh_pubkey="ssh-ed25519 AAAAC3Nz... operator@laptop"
