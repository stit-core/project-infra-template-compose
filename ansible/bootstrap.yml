---
# Доводит свежий Debian/Ubuntu VPS до состояния, когда `make deploy` работает.
# Идемпотентно — re-run safe после package-апдейтов / config-drift.
#
# Запуск:
#   ansible-playbook -i inventory.ini bootstrap.yml
#
# Required inventory-vars (per host):
#   ansible_host        — IP или DNS VPS
#   project_name        — должен совпадать с PROJECT_NAME в .env проекта
#   project_repo_url    — git URL репо <client-org>/infra
- name: Bootstrap project VPS
  hosts: project_vps
  become: true
  vars:
    project_root: "/opt/{{ project_name }}-infra"

  pre_tasks:
    - name: Verify required vars
      ansible.builtin.assert:
        that:
          - project_name is defined
          - project_repo_url is defined
        fail_msg: "Set project_name + project_repo_url in inventory."

  roles:
    - role: base
      tags: [base]
    - role: ssh-hardening
      tags: [ssh]
    - role: docker
      tags: [docker]
    - role: sftbmb-onboard
      tags: [onboard]
