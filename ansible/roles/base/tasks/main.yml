---
# Pubkey оператора заливаем ДО ssh-hardening (он выключит password auth).
# Если ключ оператора уже на хосте — переменная не нужна, опциональна.
# Передаётся через group_vars / inventory: operator_ssh_pubkey="ssh-ed25519 AAAA..."
- name: Install operator SSH pubkey (before ssh-hardening disables passwords)
  ansible.posix.authorized_key:
    user: root
    key: "{{ operator_ssh_pubkey }}"
    state: present
  when: operator_ssh_pubkey is defined and (operator_ssh_pubkey | length) > 0

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - rsync
      - htop
      - jq
      - gettext-base       # envsubst
      - chrony             # NTP
      - unattended-upgrades
      - make               # для `make deploy` / `make backup` на VPS
    state: present

- name: Configure swap (2G if missing)
  ansible.builtin.shell: |
    if ! swapon --show | grep -q '/swapfile'; then
      fallocate -l 2G /swapfile && chmod 600 /swapfile
      mkswap /swapfile && swapon /swapfile
      grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
  args:
    creates: /swapfile

- name: Ensure journald.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Limit journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/limits.conf
    content: |
      [Journal]
      SystemMaxUse=500M
      SystemKeepFree=1G
      MaxRetentionSec=1month
    mode: "0644"
  notify: restart journald

- name: Sysctl tuning
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: vm.swappiness, value: "10" }
    - { name: net.core.somaxconn, value: "1024" }
    - { name: fs.file-max, value: "200000" }
