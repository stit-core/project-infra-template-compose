---
# Disable password auth + root-with-password, fail2ban на стандартном :22.
# Pubkey оператора предполагается уже в /root/.ssh/authorized_keys
# (из VPS-provisioning); иначе роль залочит доступ.
- name: Verify root authorized_keys non-empty (refuse to harden a passworded box)
  ansible.builtin.stat:
    path: /root/.ssh/authorized_keys
  register: ak

- name: Fail if authorized_keys empty
  ansible.builtin.assert:
    that: ak.stat.exists and ak.stat.size | int > 0
    fail_msg: "/root/.ssh/authorized_keys empty — refusing to disable password auth."

- name: Configure sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-sftbmb-hardening.conf
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
    mode: "0644"
  notify: restart sshd

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: fail2ban jail.local
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 1h
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true
      logpath = %(sshd_log)s
      backend = systemd
    mode: "0644"
  notify: restart fail2ban

# notify-handler рестартит только при изменении jail.local; этот task
# гарантирует, что fail2ban включён в автозапуск и запущен и без изменений
# конфига (idempotent: systemd enabled/started — no-op если уже так).
- name: Ensure fail2ban enabled and started
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
