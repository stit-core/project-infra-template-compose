---
# Docker apt-репо зависит от дистрибутива и архитектуры хоста — выводим из
# фактов, чтобы роль работала на debian/ubuntu и amd64/arm64, а не только
# debian/amd64.
- name: Resolve Docker apt repo distro + arch
  ansible.builtin.set_fact:
    docker_distro: "{{ ansible_distribution | lower }}"
    docker_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}[ansible_architecture] | default('amd64') }}"

- name: Add Docker apt key
  ansible.builtin.shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/{{ docker_distro }}/gpg \
      | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ docker_distro }} {{ ansible_distribution_release }} stable
    mode: "0644"
  register: docker_repo

- name: Update apt after adding repo
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed

- name: Install Docker engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Enable + start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: docker daemon log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    mode: "0644"
  notify: restart docker
