---
# Настройка project_root, генерация deploy-key, клонирование репо.
# После — оператор делает `bash scripts/new-env.sh` (заполняет .env)
# и `make deploy` (первый подъём стека).
- name: Ensure project root exists
  ansible.builtin.file:
    path: "{{ project_root }}"
    state: directory
    mode: "0750"

- name: Generate deploy SSH key (if missing)
  ansible.builtin.openssh_keypair:
    path: /root/.ssh/{{ project_name }}-deploy
    type: ed25519
    comment: "{{ project_name }}-deploy@{{ inventory_hostname }}"
    mode: "0600"
  register: deploy_key

- name: Show deploy pubkey (add as deploy key in Gitea)
  ansible.builtin.command: cat /root/.ssh/{{ project_name }}-deploy.pub
  register: pubkey
  changed_when: false

- name: Print deploy pubkey
  ansible.builtin.debug:
    msg: |
      ─── Add this as a deploy key in Gitea (org/infra → Settings → Deploy Keys) ───
      {{ pubkey.stdout }}
      ──────────────────────────────────────────────────────────────────────────────

- name: SSH config for git.stit.tech
  ansible.builtin.blockinfile:
    path: /root/.ssh/config
    create: true
    mode: "0600"
    marker: "# {mark} {{ project_name }} deploy key"
    block: |
      Host git.stit.tech
        IdentityFile /root/.ssh/{{ project_name }}-deploy
        IdentitiesOnly yes
        StrictHostKeyChecking accept-new

- name: Clone project infra repo
  ansible.builtin.git:
    repo: "{{ project_repo_url }}"
    dest: "{{ project_root }}"
    update: true
    accept_hostkey: true
  ignore_errors: true   # Первый прогон: deploy-key ещё не зарегистрирован в Gitea — оператор делает это руками после вывода pubkey, потом re-run.
  register: clone

- name: Print next-step hint if clone failed
  ansible.builtin.debug:
    msg: |
      Clone упал — скорее всего deploy-key не зарегистрирован в Gitea.
      1. Скопируй pubkey выше в deploy keys репо.
      2. Re-run: ansible-playbook -i inventory.ini bootstrap.yml --tags onboard
  when: clone.failed | default(false)

- name: Install git hooks (if cloned)
  ansible.builtin.command: bash scripts/hooks-install.sh
  args:
    chdir: "{{ project_root }}"
  when: not (clone.failed | default(false))
  changed_when: false

# Backup тикает host-cron'ом, не cron внутри контейнера: scripts/backup.sh
# на хосте оркестрирует pg_dumpall (docker exec postgres) + restic backup
# (docker exec backup). Backup-контейнер — restic/restic alpine, без bash
# и без docker CLI, поэтому полная оркестрация только с хоста. Логи —
# в /var/log/<project>-backup.log; journald уже ограничен base-role'ом.
- name: Host cron — daily backup at 03:00 UTC
  ansible.builtin.cron:
    name: "{{ project_name }} daily backup"
    minute: "0"
    hour: "3"
    job: "bash {{ project_root }}/scripts/backup.sh >> /var/log/{{ project_name }}-backup.log 2>&1"
    state: present
