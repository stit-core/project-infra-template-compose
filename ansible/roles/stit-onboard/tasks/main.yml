---
# Настройка project_root, генерация deploy-key, клонирование репо.
# После — оператор делает `make new-env` (заполняет .env)
# и `make deploy` (первый подъём стека).
- name: Ensure project root exists
  ansible.builtin.file:
    path: "{{ project_root }}"
    state: directory
    mode: "0750"

- name: Generate deploy SSH key (if missing)
  ansible.builtin.openssh_keypair:
    path: /root/.ssh/{{ project_name }}-deploy
    type: ed25519
    comment: "{{ project_name }}-deploy@{{ inventory_hostname }}"
    mode: "0600"
  register: deploy_key

- name: Show deploy pubkey (add as deploy key in Gitea)
  ansible.builtin.command: cat /root/.ssh/{{ project_name }}-deploy.pub
  register: pubkey
  changed_when: false

- name: Print deploy pubkey
  ansible.builtin.debug:
    msg: |
      ─── Add this as a deploy key in Gitea (org/infra → Settings → Deploy Keys) ───
      {{ pubkey.stdout }}
      ──────────────────────────────────────────────────────────────────────────────

# Хост git выводится из project_repo_url; override — git_host в inventory.
- name: Resolve git host for deploy key
  ansible.builtin.set_fact:
    git_host: "{{ git_host | default(project_repo_url | regex_replace('^(?:ssh://)?[^@]+@([^:/]+).*$', '\\1'), true) }}"

- name: SSH config for {{ git_host }} (deploy key)
  ansible.builtin.blockinfile:
    path: /root/.ssh/config
    create: true
    mode: "0600"
    marker: "# {mark} {{ project_name }} deploy key"
    block: |
      Host {{ git_host }}
        IdentityFile /root/.ssh/{{ project_name }}-deploy
        IdentitiesOnly yes
        StrictHostKeyChecking accept-new

- name: Clone project infra repo
  ansible.builtin.git:
    repo: "{{ project_repo_url }}"
    dest: "{{ project_root }}"
    update: true
    accept_hostkey: true
  ignore_errors: true   # Первый прогон: deploy-key ещё не зарегистрирован в Gitea — оператор делает это руками после вывода pubkey, потом re-run.
  register: clone

- name: Print next-step hint if clone failed
  ansible.builtin.debug:
    msg: |
      Clone упал — скорее всего deploy-key не зарегистрирован в Gitea.
      1. Скопируй pubkey выше в deploy keys репо.
      2. Re-run: ansible-playbook -i inventory.ini bootstrap.yml --tags onboard
  when: clone.failed | default(false)

- name: Run repo setup — git hooks + dev-deps (if cloned)
  ansible.builtin.command: bash scripts/setup.sh
  args:
    chdir: "{{ project_root }}"
  when: not (clone.failed | default(false))
  register: setup
  # setup.sh печатает «installed:» при (пере)линковке git-хуков — честный
  # changed-сигнал вместо слепого `changed_when: false`, который маскировал
  # реальную установку. register оставляет stdout для диагностики.
  changed_when: "'installed:' in setup.stdout"

# Backup теперь self-contained — busybox crond внутри backup-контейнера
# (см. containers/backup/). Host-cron больше не нужен; если был от старой
# версии шаблона — удаляем для чистого upgrade-path'а.
- name: Remove legacy host-cron (backup is now in-container)
  ansible.builtin.cron:
    name: "{{ project_name }} daily backup"
    state: absent
