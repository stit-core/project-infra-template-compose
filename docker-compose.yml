# Сети + named volumes. Сервисы — в compose/*.yml, склеиваются через
# COMPOSE_ARGS в Makefile.

networks:
  proxy:
    name: proxy
    driver: bridge
  backend-net:
    name: backend-net
    driver: bridge
    internal: true

volumes:
  traefik-acme:
  crowdsec-data:
  crowdsec-config:
  postgres-data:
  vault-agent-secrets:
  vault-agent-bootstrap:
  otel-agent-data:
  backup-cache:
  runner-data:
