# Pull-based deploy. Триггеры:
#   push.branches=main  → staging (runner label <project>-staging)
#   push.tags=v*        → prod    (runner label <project>-prod)
#
# В клиентском репо файл копируется в .gitea/workflows/deploy.yml. Здесь
# держим в ci/gitea/workflows/ — чтобы шаблонный репо сам себя не деплоил.
name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, "${{ vars.PROJECT_NAME }}-staging"]
    steps:
      - name: Pull + deploy
        run: |
          cd /opt/${{ vars.PROJECT_NAME }}-infra
          git pull --ff-only origin main
          make deploy

  prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, "${{ vars.PROJECT_NAME }}-prod"]
    steps:
      - name: Pull + deploy at tag
        run: |
          cd /opt/${{ vars.PROJECT_NAME }}-infra
          git fetch --tags
          git checkout ${{ github.ref_name }}
          make deploy
