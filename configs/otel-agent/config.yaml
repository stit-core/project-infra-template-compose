receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  # Скрейпит локальные cadvisor + node-exporter и пускает их в тот же
  # pipeline, что и app-телеметрию: resource processor поставит
  # service.namespace=$OTEL_TENANT, корп-otel маршрутизирует в VM
  # под нужный accountID. Job-лейбл сохраняется (cadvisor / node-exporter).
  prometheus:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 30s
          static_configs:
            - targets: ['cadvisor:8080']
        - job_name: node-exporter
          scrape_interval: 30s
          static_configs:
            - targets: ['node-exporter:9100']

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: service.namespace
        value: ${env:OTEL_TENANT}
        action: upsert
      - key: tenant
        value: ${env:OTEL_TENANT}
        action: upsert

exporters:
  otlphttp/corp:
    endpoint: https://${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:OTEL_TOKEN}"
    tls:
      insecure: ${env:OTEL_EXPORTER_OTLP_INSECURE}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/corp]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/corp]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/corp]
