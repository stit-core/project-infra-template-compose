# Tuned for small VPS (2-4 GB RAM). Adjust per project size.
listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
work_mem = 4MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging — verbose enough for incident triage, lean enough not to fill disk.
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p] %u@%d '
log_timezone = 'UTC'

# WAL — basic durability defaults; restic backs up volume nightly.
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
