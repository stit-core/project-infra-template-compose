# Тюнинг под small VPS (2-4 GB RAM). При большем размере проекта — поднять.
listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
work_mem = 4MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging — достаточно для incident triage, без забивания диска.
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p] %u@%d '
log_timezone = 'UTC'

# WAL — базовый durability; nightly restic-backup volume'а.
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
